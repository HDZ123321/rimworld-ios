name: build-ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'payload/**'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish probe status
        run: |
          set -e
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          {
            echo "probe=ok"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-status/probe.txt
          git checkout -B ci-status
          git add -A ci-status
          git commit -q -m "ci: probe ${GITHUB_RUN_ID}" || true
          git push -f origin HEAD:refs/heads/ci-status
          echo "probe pushed"

  build:
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark build started
        run: |
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          {
            echo "status=running"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-status/state.txt
          git checkout -B ci-status
          git add -A ci-status
          git commit -q -m "ci: build ${GITHUB_RUN_ID} started" || true
          git push -f origin HEAD:refs/heads/ci-status || true

      - name: Free disk space
        run: |
          set -x
          df -h /
          KEEP=""
          for v in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app \
                   /Applications/Xcode_15.2.app /Applications/Xcode_15.1.app \
                   /Applications/Xcode_15.0.1.app /Applications/Xcode_15.0.app \
                   /Applications/Xcode.app; do
            if [ -d "$v" ] && [ -z "$KEEP" ]; then KEEP="$v"; fi
          done
          echo "KEEP=$KEEP"
          for v in /Applications/Xcode*.app; do
            if [ "$v" != "$KEEP" ]; then sudo rm -rf "$v" || true; fi
          done
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          df -h /

      - name: Install 7-Zip
        run: |
          set -e
          if command -v 7z  >/dev/null 2>&1; then echo "7z present";  exit 0; fi
          if command -v 7zz >/dev/null 2>&1; then echo "7zz present"; exit 0; fi
          brew install sevenzip

      - name: Extract Xcode project
        run: |
          set -e
          SEVENZ=$(command -v 7z || command -v 7zz || command -v 7za)
          echo "using $SEVENZ"
          mkdir -p work/iOS
          "$SEVENZ" x -y -owork/iOS payload/ios-build.7z.001
          test -f work/iOS/Unity-iPhone.xcodeproj/project.pbxproj
          du -sh work/iOS
          ls work/iOS

      - name: Free disk (drop payload + intel il2cpp)
        run: |
          rm -rf payload
          rm -rf work/iOS/Il2CppOutputProject/IL2CPP/build/deploy_x86_64
          df -h /

      - name: Select Xcode
        run: |
          set -e
          for v in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app \
                   /Applications/Xcode_15.2.app /Applications/Xcode_15.1.app \
                   /Applications/Xcode_15.0.1.app /Applications/Xcode_15.0.app \
                   /Applications/Xcode.app; do
            if [ -d "$v" ]; then
              echo "DEVELOPER_DIR=$v" >> "$GITHUB_ENV"
              echo "selected $v"
              break
            fi
          done
          xcodebuild -version
          xcode-select -p

      - name: Sanity check IL2CPP host toolchain
        run: |
          set -e
          cd work/iOS
          IL2CPP_DIR=Il2CppOutputProject/IL2CPP/build/deploy_arm64
          ls -la "$IL2CPP_DIR" | head -20
          chmod +x "$IL2CPP_DIR/il2cpp"
          chmod +x "$IL2CPP_DIR/bee_backend/mac-arm64/bee_backend"
          file "$IL2CPP_DIR/il2cpp"
          file "$IL2CPP_DIR/bee_backend/mac-arm64/bee_backend"
          codesign --remove-signature "$IL2CPP_DIR/il2cpp" 2>/dev/null || true
          codesign --remove-signature "$IL2CPP_DIR/bee_backend/mac-arm64/bee_backend" 2>/dev/null || true
          "$IL2CPP_DIR/il2cpp" --version || echo "il2cpp --version returned $?"

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          cd work/iOS
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/RimWorld.xcarchive" \
            -derivedDataPath "$PWD/build/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            VALIDATE_PRODUCT=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$GITHUB_WORKSPACE/archive.log"

      - name: Package unsigned ipa
        run: |
          set -e
          cd work/iOS
          APP=$(find build/RimWorld.xcarchive/Products/Applications -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "archive produced no .app, falling back to plain build"
            xcodebuild build \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/build/dd" \
              CONFIGURATION_BUILD_DIR="$PWD/build/out" \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_ENTITLEMENTS="" ENABLE_BITCODE=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
              DEBUG_INFORMATION_FORMAT=dwarf VALIDATE_PRODUCT=NO COMPILER_INDEX_STORE_ENABLE=NO \
              2>&1 | tee "$GITHUB_WORKSPACE/archive.log"
            APP=$(find build/out -maxdepth 1 -name '*.app' | head -1)
          fi
          echo "APP=$APP"
          test -n "$APP"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry ../RimWorld-unsigned.ipa Payload
          cd ..
          ls -lh RimWorld-unsigned.ipa
          APPB=$(basename "$APP")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "Payload/$APPB/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "Payload/$APPB/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "Payload/$APPB/Info.plist" || true
          ls -la "Payload/$APPB" | head -25
          du -sh "Payload/$APPB/Data/Raw" || true
          lipo -info "Payload/$APPB/$APPB" || true
          df -h /

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: RimWorld-unsigned-ipa
          path: work/iOS/RimWorld-unsigned.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: archive.log
          if-no-files-found: warn

      - name: Show failure tail
        if: failure()
        run: |
          echo "===== last 250 lines ====="
          tail -250 archive.log 2>/dev/null || true
          df -h / || true

      - name: Publish ipa via release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          IPA="$GITHUB_WORKSPACE/work/iOS/RimWorld-unsigned.ipa"
          ls -lh "$IPA"
          TAG="ipa-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$IPA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RimWorld iOS unsigned ipa (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned ipa built from commit ${GITHUB_SHA}. Sideload with your own signing."
          echo "released $TAG"

      - name: Mark build result
        if: always()
        run: |
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          {
            echo "status=${{ job.status }}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tag=ipa-${GITHUB_RUN_NUMBER}"
          } > ci-status/state.txt
          git checkout -B ci-status
          git add -A ci-status
          git commit -q -m "ci: build ${GITHUB_RUN_ID} ${{ job.status }}" || true
          git push -f origin HEAD:refs/heads/ci-status || true
