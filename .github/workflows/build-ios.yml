name: build-ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'payload/**'

permissions:
  contents: write

env:
  LOG: ${{ github.workspace }}/step.log
  # Actions cache 总共 10 GB。721 个 IL2CPP 翻译单元的 .o 加起来约 3 GB，
  # 但 sccache 还要存源码哈希索引与压缩副本；给到 8G 留 2G 给 artifact/cache 别的用途。
  # 不设上限的话 sccache 默认 10G，会把整个 cache 配额吃满，导致别的 run 全部 miss。
  SCCACHE_CACHE_SIZE: 8G
  # 这两项必须在 workflow 级就设上：sccache 是常驻 daemon，由「第一个调用它的 step」
  # 拉起，之后整个 job 共用这一个进程，它只认自己启动时的环境变量。原来只写在 Archive
  # 一步的 env 里，而 Wrap-clang 那步先跑了 sccache --show-stats 把 daemon 拉起来 ——
  # 后端于是永远是本地磁盘，Actions cache 一次都没写过，每次 run 都是冷编译。
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: "1"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350
    # 注意别在这层给 SCCACHE_DIR 写 runner.temp：job 级 env 求值时也没有
    # runner 上下文，GitHub 直接判 workflow 非法（"Unrecognized named-value: 'runner'",
    # run 建出来 0 个 job 立刻 failure）。sccache 在本机默认落 ~/.cache/sccache，
    # 位置无所谓，真正决定能不能复用的是 SCCACHE_GHA_ENABLED 那两项。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -x
          df -h /
          KEEP=""
          for v in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app \
                   /Applications/Xcode_15.2.app /Applications/Xcode_15.1.app \
                   /Applications/Xcode_15.0.1.app /Applications/Xcode_15.0.app \
                   /Applications/Xcode.app; do
            if [ -d "$v" ] && [ -z "$KEEP" ]; then KEEP="$v"; fi
          done
          echo "KEEP=$KEEP"
          for v in /Applications/Xcode*.app; do
            if [ "$v" != "$KEEP" ]; then sudo rm -rf "$v" || true; fi
          done
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          df -h /

      # The payload was packed with 7-Zip 25.01 which enables the ARM64 BCJ
      # filter. Homebrew's "sevenzip" is 17.05 and rejects that filter with
      # "Unsupported Method". Fetch the official 24.x universal 7zz instead.
      - name: Install modern 7-Zip
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -x
          mkdir -p "$RUNNER_TEMP/7z"
          cd "$RUNNER_TEMP/7z"
          ok=0
          for u in \
            "https://github.com/ip7z/7zip/releases/download/25.01/7z2501-mac.tar.xz" \
            "https://github.com/ip7z/7zip/releases/download/26.05/7z2605-mac.tar.xz" \
            "https://www.7-zip.org/a/7z2301-mac.tar.xz" ; do
            echo "try $u"
            if curl -fL --retry 3 --retry-delay 2 -o 7z.tar.xz "$u"; then ok=1; break; fi
          done
          test "$ok" = "1"
          ls -lh 7z.tar.xz
          tar -xf 7z.tar.xz
          ls -la
          chmod +x ./7zz || true
          echo "$RUNNER_TEMP/7z" >> "$GITHUB_PATH"
          ./7zz | head -5

      - name: Probe payload volumes
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -x
          SEVENZ=$(command -v 7zz)
          echo "SEVENZ=$SEVENZ"
          "$SEVENZ" | head -5
          ls -la payload
          du -sh payload
          cat payload/ios-build.7z.0* > /tmp/ios-build.7z
          ls -lh /tmp/ios-build.7z
          shasum -a 256 /tmp/ios-build.7z
          "$SEVENZ" l /tmp/ios-build.7z | head -30

      - name: Extract Xcode project
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -x
          SEVENZ=$(command -v 7zz)
          mkdir -p work/iOS
          df -h /
          set +e
          "$SEVENZ" x -y -bso0 -bsp0 -owork/iOS /tmp/ios-build.7z
          RC=$?
          set -e
          echo "extract rc=$RC"
          du -sh work/iOS || true
          find work/iOS -type f | wc -l
          df -h /
          if [ "$RC" != "0" ]; then
            echo "EXTRACT FAILED rc=$RC"
            exit "$RC"
          fi
          test -f work/iOS/Unity-iPhone.xcodeproj/project.pbxproj
          rm -f /tmp/ios-build.7z

      - name: Free disk (drop payload + intel il2cpp)
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -x
          rm -rf payload
          rm -rf work/iOS/Il2CppOutputProject/IL2CPP/build/deploy_x86_64
          df -h /

      - name: Select Xcode
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -e
          for v in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app \
                   /Applications/Xcode_15.2.app /Applications/Xcode_15.1.app \
                   /Applications/Xcode_15.0.1.app /Applications/Xcode_15.0.app \
                   /Applications/Xcode.app; do
            if [ -d "$v" ]; then
              echo "DEVELOPER_DIR=$v" >> "$GITHUB_ENV"
              echo "selected $v"
              break
            fi
          done
          xcodebuild -version
          xcode-select -p

      # Archive 一步要冷编译 721 个 IL2CPP 生成的 .cpp（合计 1.09 GB），
      # 每个 run 都是全新 runner + 空 derivedDataPath，等于每次都从零编一遍。
      # sccache 把编译产物按内容哈希存进 Actions cache（10 GB 额度），
      # 第二次起只有真正改动过的翻译单元会重编。
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # xcodebuild 不认 CC="sccache clang" 这种带空格的写法，
      # 标准做法是放一层 clang 垫片在 PATH 最前面，让 xcrun 解析到的 clang 被截走。
      - name: Wrap clang with sccache
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -e
          CC_BIN=$(xcrun -f clang)
          CXX_BIN=$(xcrun -f clang++)
          echo "clang=$CC_BIN"
          echo "clangxx=$CXX_BIN"
          mkdir -p "$RUNNER_TEMP/ccwrap"
          printf '#!/bin/bash\nexec sccache "%s" "$@"\n' "$CC_BIN"  > "$RUNNER_TEMP/ccwrap/clang"
          printf '#!/bin/bash\nexec sccache "%s" "$@"\n' "$CXX_BIN" > "$RUNNER_TEMP/ccwrap/clang++"
          chmod +x "$RUNNER_TEMP/ccwrap/clang" "$RUNNER_TEMP/ccwrap/clang++"
          sccache --version || true
          # 冒烟：只在确认垫片能把 --version 透传过去之后才写进 GITHUB_PATH。
          # 垫片一旦坏了会截走整个 job 的 clang，archive 直接全红，代价是一次 45 分钟的 run；
          # 这里先在本 step 内验证一遍，坏了就退回系统 clang（不缓存也能编）。
          export PATH="$RUNNER_TEMP/ccwrap:$PATH"
          if clang --version && clang++ --version; then
            echo "$RUNNER_TEMP/ccwrap" >> "$GITHUB_PATH"
            echo "sccache shim active"
          else
            echo "::warning::sccache clang shim is broken; running archive with the system clang (no compiler cache)"
          fi
          echo "--- sccache backend ---"
          env | grep -E '^SCCACHE_' | sort || true
          sccache --show-stats || true

      - name: Sanity check IL2CPP host toolchain
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -x
          cd work/iOS
          IL2CPP_DIR=Il2CppOutputProject/IL2CPP/build/deploy_arm64
          ls -la "$IL2CPP_DIR" | head -20
          chmod +x "$IL2CPP_DIR/il2cpp"
          chmod +x "$IL2CPP_DIR/bee_backend/mac-arm64/bee_backend"
          file "$IL2CPP_DIR/il2cpp" || true
          file "$IL2CPP_DIR/bee_backend/mac-arm64/bee_backend" || true
          codesign --remove-signature "$IL2CPP_DIR/il2cpp" 2>/dev/null || true
          codesign --remove-signature "$IL2CPP_DIR/bee_backend/mac-arm64/bee_backend" 2>/dev/null || true
          "$IL2CPP_DIR/il2cpp" --version || echo "il2cpp --version returned $?"

      - name: Archive (unsigned)
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -o pipefail
          set -x
          sccache --show-stats || true
          cd work/iOS
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/RimWorld.xcarchive" \
            -derivedDataPath "$PWD/build/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            VALIDATE_PRODUCT=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          rc=$?
          echo "=== sccache stats after archive (rc=$rc) ==="
          sccache --show-stats || true
          exit $rc
      - name: Package unsigned ipa
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -x
          cd work/iOS
          APP=$(find build/RimWorld.xcarchive/Products/Applications -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "archive produced no .app, falling back to plain build"
            xcodebuild build \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/build/dd" \
              CONFIGURATION_BUILD_DIR="$PWD/build/out" \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_ENTITLEMENTS="" ENABLE_BITCODE=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
              DEBUG_INFORMATION_FORMAT=dwarf VALIDATE_PRODUCT=NO COMPILER_INDEX_STORE_ENABLE=NO
            APP=$(find build/out -maxdepth 1 -name '*.app' | head -1)
          fi
          echo "APP=$APP"
          test -n "$APP"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry ../RimWorld-unsigned.ipa Payload
          cd ..
          ls -lh RimWorld-unsigned.ipa
          APPB=$(basename "$APP")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "ipa/Payload/$APPB/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "ipa/Payload/$APPB/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "ipa/Payload/$APPB/Info.plist" || true
          du -sh "ipa/Payload/$APPB/Data/Raw" || true
          lipo -info "ipa/Payload/$APPB/$APPB" || true
          df -h /

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimWorld-unsigned-ipa
          path: work/iOS/RimWorld-unsigned.ipa
          compression-level: 0
          if-no-files-found: warn

      - name: Publish ipa as release asset
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec > >(tee -a "$LOG") 2>&1
          set -x
          IPA="$GITHUB_WORKSPACE/work/iOS/RimWorld-unsigned.ipa"
          ls -lh "$IPA"
          TAG="ipa-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$IPA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RimWorld iOS unsigned ipa (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned ipa built from commit ${GITHUB_SHA}. Sideload with your own signing."
          echo "released $TAG"

      - name: Publish logs to ci-status branch
        if: always()
        run: |
          set -x
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci-status
          {
            echo "status=${{ job.status }}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "sha=${GITHUB_SHA}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-status/state.txt
          if [ -f "$LOG" ]; then tail -c 400000 "$LOG" > ci-status/step.txt; else echo "no step.log" > ci-status/step.txt; fi
          ls -lh ci-status || true
          git checkout -B ci-status
          git add -Af ci-status
          git commit -q -m "ci: build ${GITHUB_RUN_ID} ${{ job.status }}" || true
          git push -f origin HEAD:refs/heads/ci-status || true
